name: 白嫖爬虫

on:
  # 每天 北京时间 9:15 / 21:15 各跑一次（错开发售爬虫，UTC 1:15 / 13:15）
  schedule:
    - cron: '15 1,13 * * *'
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行白嫖爬虫
        run: python crawler/free-crawler.py

      - name: 提交 free.json
        run: |
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add crawler/output/free.json
          git diff --cached --quiet || git commit -m "更新白嫖数据 $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 刷新 jsDelivr CDN 缓存
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/crawler/output/free.json" || true
